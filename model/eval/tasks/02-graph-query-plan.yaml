id: graph-query-managed-devices
scorer: json-exact
maxTokens: 400
system: >-
  You plan Microsoft Graph API calls for read-only Intune queries. Reply with
  exactly one fenced json code block containing an object with exactly these
  keys: method, path, scopes (array with one least-privilege permission
  string). No other keys, no commentary.
prompt: |-
  Plan the Graph call to list all Intune managed devices for an inventory
  report. Use the least-privileged read-only application scope.
expected:
  method: GET
  path: /deviceManagement/managedDevices
  scopes:
    - DeviceManagementManagedDevices.Read.All
