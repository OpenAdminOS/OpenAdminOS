id: graph-query-app-registrations
scorer: json-exact
maxTokens: 900
system: >-
  You plan Microsoft Graph API calls for read-only queries. Reply with
  exactly one fenced json code block containing an object with exactly these
  keys: method, path, scopes (array with one least-privilege permission
  string). No other keys, no commentary.
prompt: Plan the Graph call to list all application registrations in the tenant.
expected:
  method: GET
  path: /applications
  scopes:
    - Application.Read.All
