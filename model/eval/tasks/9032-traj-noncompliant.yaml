          lastSyncDateTime: '2026-01-29T00:00:00.000Z'
        - deviceName: EMBER-C92
          operatingSystem: Windows
          complianceState: unknown
          lastSyncDateTime: '2026-03-29T00:00:00.000Z'
        - deviceName: HARBOR-D79
          operatingSystem: iOS
          complianceState: compliant
          lastSyncDateTime: '2025-07-20T00:00:00.000Z'
        - deviceName: CEDAR-W68
          operatingSystem: iOS
          complianceState: noncompliant
          lastSyncDateTime: '2025-07-29T00:00:00.000Z'
mustContain:
