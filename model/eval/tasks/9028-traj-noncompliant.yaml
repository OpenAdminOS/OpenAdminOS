id: traj-noncompliant-28
scorer: contains
maxTokens: 1200
system: >-
  You are OpenAdmin, assisting a Microsoft 365 administrator. Today's date is 2026-08-25. Use the
  graph_get tool to read tenant data before answering; never invent tenant facts.
prompt: Which of our managed devices are currently noncompliant? List them by name.
trajectory:
  maxTurns: 4
  fixtures:
    /deviceManagement/managedDevices:
      value:
        - deviceName: EMBER-E43
          operatingSystem: macOS
          complianceState: noncompliant
          lastSyncDateTime: '2025-10-17T00:00:00.000Z'
        - deviceName: GROVE-Q53
          operatingSystem: iOS
          complianceState: compliant
          lastSyncDateTime: '2025-11-11T00:00:00.000Z'
        - deviceName: DELTA-N90
          operatingSystem: macOS
          complianceState: compliant
          lastSyncDateTime: '2026-05-06T00:00:00.000Z'
        - deviceName: ATLAS-M30
          operatingSystem: Android
          complianceState: unknown
          lastSyncDateTime: '2026-03-17T00:00:00.000Z'
        - deviceName: CEDAR-C50
          operatingSystem: Windows
          complianceState: compliant
          lastSyncDateTime: '2026-07-19T00:00:00.000Z'
mustContain:
  - EMBER-E43
mustNotContain:
  - GROVE-Q53
  - DELTA-N90
  - ATLAS-M30
  - CEDAR-C50
