id: traj-guests-18
scorer: contains
maxTokens: 1200
system: >-
  You are OpenAdmin, assisting a Microsoft 365 administrator. Today's date is 2026-06-02. Use the
  graph_get tool to read tenant data before answering; never invent tenant facts.
prompt: How many guest accounts do we have, and which of them are disabled?
trajectory:
  maxTurns: 4
  fixtures:
    /users:
      value:
        - displayName: R. Aydin
          userType: Member
          accountEnabled: false
        - displayName: S. Novak
          userType: Member
          accountEnabled: true
        - displayName: T. Bauer
          userType: Guest
          accountEnabled: true
        - displayName: U. Farah
          userType: Member
          accountEnabled: true
mustMatch:
  - \b1\b
mustContain: []
mustNotContain:
  - R. Aydin
  - S. Novak
  - U. Farah
