id: gen-graph-seen-0
scorer: json-exact
maxTokens: 900
system: >-
  You plan Microsoft Graph API calls for read-only queries. Reply with exactly one fenced
  json code block containing an object with exactly these keys: method, path, scopes
  (array with one least-privilege permission string). No other keys, no commentary.
prompt: Plan the Graph call to list all managed devices needing a hardware inventory export.
expected:
  method: GET
  path: /deviceManagement/managedDevices
  scopes:
    - DeviceManagementManagedDevices.Read.All
