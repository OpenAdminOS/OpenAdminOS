id: traj-noncompliant-20
scorer: contains
maxTokens: 1200
system: >-
  You are OpenAdmin, assisting a Microsoft 365 administrator. Today's date is 2026-10-10. Use the
  graph_get tool to read tenant data before answering; never invent tenant facts.
prompt: Which of our managed devices are currently noncompliant? List them by name.
trajectory:
  maxTurns: 4
  fixtures:
    /deviceManagement/managedDevices:
      value:
        - deviceName: HARBOR-S49
          operatingSystem: macOS
          complianceState: noncompliant
          lastSyncDateTime: '2026-01-28T00:00:00.000Z'
        - deviceName: BEACON-M96
          operatingSystem: Windows
          complianceState: noncompliant
          lastSyncDateTime: '2026-06-10T00:00:00.000Z'
        - deviceName: CEDAR-K29
          operatingSystem: iOS
          complianceState: compliant
          lastSyncDateTime: '2026-05-29T00:00:00.000Z'
        - deviceName: DELTA-Y47
          operatingSystem: Android
          complianceState: noncompliant
          lastSyncDateTime: '2025-12-07T00:00:00.000Z'
        - deviceName: GROVE-Z45
          operatingSystem: macOS
          complianceState: unknown
          lastSyncDateTime: '2026-05-26T00:00:00.000Z'
mustContain:
  - HARBOR-S49
  - BEACON-M96
  - DELTA-Y47
mustNotContain:
  - CEDAR-K29
  - GROVE-Z45
