id: gen-reasoning-retire-5
scorer: contains
maxTokens: 700
system: >-
  You are an Intune device hygiene reviewer. Be factual and conservative. Today's date is
  2026-09-18.
prompt: >-
  These are managed devices with their last Intune sync dates:

  - LAPTOP-GEORGE: 2026-01-09

  - DESKTOP-DEV: 2026-08-10

  - VM-FATMA: 2025-10-16

  - PHONE-HANA: 2025-11-18

  - LAPTOP-ERIK: 2026-03-26

  - DESKTOP-ADA: 2025-10-27


  A device is a retirement-review candidate when it has not synced for at least 210 days.
  List only the retirement-review candidates by device name.
mustContain:
  - LAPTOP-GEORGE
  - VM-FATMA
  - PHONE-HANA
  - DESKTOP-ADA
mustNotContain:
  - DESKTOP-DEV
  - LAPTOP-ERIK
