          complianceState: compliant
          lastSyncDateTime: '2026-01-19T00:00:00.000Z'
        - deviceName: CEDAR-B20
          operatingSystem: iOS
          complianceState: noncompliant
          lastSyncDateTime: '2025-04-29T00:00:00.000Z'
        - deviceName: ATLAS-O44
          operatingSystem: iOS
          complianceState: noncompliant
          lastSyncDateTime: '2025-06-10T00:00:00.000Z'
        - deviceName: BEACON-Q49
          operatingSystem: iOS
          complianceState: unknown
          lastSyncDateTime: '2026-02-02T00:00:00.000Z'
        - deviceName: HARBOR-G48
          operatingSystem: iOS
          complianceState: noncompliant
          lastSyncDateTime: '2025-04-23T00:00:00.000Z'
