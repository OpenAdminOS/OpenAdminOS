      value:
        - deviceName: HARBOR-H90
          operatingSystem: Android
          complianceState: unknown
          lastSyncDateTime: '2025-10-14T00:00:00.000Z'
        - deviceName: ATLAS-J96
          operatingSystem: Android
          complianceState: compliant
          lastSyncDateTime: '2026-04-19T00:00:00.000Z'
        - deviceName: DELTA-K72
          operatingSystem: Windows
          complianceState: compliant
          lastSyncDateTime: '2026-06-28T00:00:00.000Z'
        - deviceName: FJORD-R99
          operatingSystem: macOS
          complianceState: noncompliant
          lastSyncDateTime: '2026-04-15T00:00:00.000Z'
        - deviceName: EMBER-M99
          operatingSystem: iOS
          complianceState: unknown
          lastSyncDateTime: '2026-03-22T00:00:00.000Z'
mustContain:
  - FJORD-R99
mustNotContain:
  - HARBOR-H90
  - ATLAS-J96
  - DELTA-K72
  - EMBER-M99
