id: traj-ca-43
scorer: contains
maxTokens: 1400
system: >-
  You are OpenAdmin, assisting a Microsoft 365 administrator. Today's date is 2026-01-09. Use the
  graph_get tool to read tenant data before answering; never invent tenant facts.
prompt: Review our conditional access policies and tell me which ones are not actively enforcing.
trajectory:
  maxTurns: 4
  fixtures:
    /identity/conditionalAccess/policies:
      value:
        - displayName: Baseline MFA
          state: enabled
        - displayName: Legacy Auth Block
          state: disabled
        - displayName: Risky Sign-in
          state: disabled
        - displayName: Device Compliance Gate
          state: enabled
        - displayName: Admin Step-up
          state: enabledForReportingButNotEnforced
mustContain:
  - Legacy Auth Block
  - Risky Sign-in
  - Admin Step-up
mustNotContain:
  - Baseline MFA
  - Device Compliance Gate
