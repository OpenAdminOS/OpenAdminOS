          operatingSystem: Android
          complianceState: compliant
          lastSyncDateTime: '2025-10-28T00:00:00.000Z'
        - deviceName: CEDAR-G84
          operatingSystem: Windows
          complianceState: unknown
          lastSyncDateTime: '2025-10-20T00:00:00.000Z'
