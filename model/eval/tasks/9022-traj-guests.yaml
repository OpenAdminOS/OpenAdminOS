id: traj-guests-22
scorer: contains
maxTokens: 1200
system: >-
  You are OpenAdmin, assisting a Microsoft 365 administrator. Today's date is 2026-11-26. Use the
  graph_get tool to read tenant data before answering; never invent tenant facts.
prompt: How many guest accounts do we have, and which of them are disabled?
trajectory:
  maxTurns: 4
  fixtures:
    /users:
      value:
        - displayName: R. Aydin
          userType: Guest
          accountEnabled: true
        - displayName: S. Novak
          userType: Guest
          accountEnabled: true
        - displayName: T. Bauer
          userType: Member
          accountEnabled: true
        - displayName: U. Farah
          userType: Guest
          accountEnabled: true
        - displayName: V. Ionescu
          userType: Member
          accountEnabled: false
        - displayName: W. Costa
          userType: Guest
          accountEnabled: true
mustMatch:
  - \b4\b
mustContain: []
mustNotContain:
  - T. Bauer
  - V. Ionescu
