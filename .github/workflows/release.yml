name: Release

# Builds platform-specific installers and uploads publishable assets to a
# GitHub release.
#
# Triggers:
#   - Tag push matching v*.*.* (the canonical "cut a release" gesture)
#   - workflow_dispatch (one-time branch build without publishing)
#
# Outputs:
#   - Windows x64: signed NSIS .exe installer, plus latest.yml for
#     electron-updater auto-update. Signing goes through Azure Artifact
#     Signing, so the certificate is short-lived, Microsoft-issued, and the
#     private key never exists outside their HSM. Maintainers can still opt
#     into an unsigned .appx packaging validation job from workflow_dispatch
#     for the deferred Microsoft Store path; that AppX is never uploaded as
#     an artifact or release asset.
#   - macOS (Apple Silicon): notarized + signed .dmg + .pkg,
#     plus .zip/latest-mac.yml for electron-updater auto-update.
#   - Linux x64: unsigned AppImage, .deb, and .rpm packages, plus
#     SHA256SUMS.txt generated from the release assets. The .deb is also
#     published into a signed GitHub Pages-backed apt repository.
#
# Secrets required on the repo or org:
#   macOS:  CSC_LINK, CSC_KEY_PASSWORD, CSC_INSTALLER_LINK,
#           CSC_INSTALLER_KEY_PASSWORD, APPLE_API_KEY,
#           APPLE_API_KEY_ID, APPLE_API_ISSUER
#   Windows: AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET (an Entra
#           service principal with the Artifact Signing Certificate Profile
#           Signer role), plus the repository variables
#           AZURE_SIGNING_ENDPOINT, AZURE_SIGNING_ACCOUNT_NAME, and
#           AZURE_CERT_PROFILE_NAME. See docs/RELEASING.md.
#   Linux apt repo: APT_GPG_PRIVATE_KEY, optional APT_GPG_PASSPHRASE
#   (Windows AppX validation is manual-only, unsigned, and is not published.
#   Linux artifacts are unsigned packages and are published with SHA-256
#   checksums.)
#
# All `GITHUB_TOKEN` use comes from the auto-provided actions token.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      build_windows:
        description: "Also run the Windows AppX packaging validation job"
        required: false
        default: false
        type: boolean
      backfill_apt_tag:
        description: "Existing release tag to republish into the apt repository"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  id-token: write
  pages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Opt into Node 24 for JavaScript actions ahead of GitHub's June 2026
  # forced cutover. Silences the EOL warnings the runner emits otherwise.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release-gate:
    name: Verify release source
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.backfill_apt_tag != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENAGENTS_QA_SKILL_REPO: https://github.com/merill/msgraph.git
      OPENAGENTS_QA_SKILL_REF: main
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Generated agent docs include path-specific commit metadata.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck and unit tests
        run: |
          npm run typecheck
          npm test

      - name: Resolve msgraph skill
        run: |
          eval "$(bash scripts/setup-qa.sh)"
          echo "MSGRAPH_SKILL_DIR=$MSGRAPH_SKILL_DIR" >> "$GITHUB_ENV"

      - name: Graph, registry, and documentation gates
        run: |
          npm run qa
          npm run docs:check

      - name: Verify release and upgrade compatibility
        run: npm run release:check

      - name: Build and run Electron smoke tests
        run: |
          npm run build
          npm run build:electron -w @openadminos/desktop
          xvfb-run -a node scripts/smoke-intune-chat.mjs
          xvfb-run -a node scripts/smoke-report-issue.mjs

  windows-appx:
    name: Windows AppX (unsigned, manual validation only)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_windows && inputs.backfill_apt_tag == '' }}
    needs: release-gate
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      # The published Windows artifact is the signed NSIS installer built by
      # the windows-x64 job. This job only proves the Microsoft Store AppX
      # packaging path still works, so it opts the signing hook out rather
      # than signing a package nobody installs.
      OPENADMINOS_ALLOW_UNSIGNED_WINDOWS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build AppX
        # The target is named explicitly because build.win.target is now nsis;
        # a bare --win would build the installer instead. --publish never: we
        # don't upload from electron-builder, and this AppX is only ever built
        # to validate the packaging path for the deferred Store submission.
        run: npm run dist -w @openadminos/desktop -- --win=appx --publish never

      - name: Verify AppX build output
        shell: pwsh
        run: |
          $appx = Get-ChildItem -Path apps/desktop/release -Filter *.appx | Select-Object -First 1
          if (-not $appx) {
            Write-Error "Windows build completed but no .appx was produced."
            exit 1
          }
          Write-Host "Built $($appx.Name); not uploading it as an artifact."

  windows-x64:
    name: Windows x64, signed NSIS installer
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.backfill_apt_tag != '') }}
    needs: release-gate
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      # Azure Artifact Signing (renamed from Trusted Signing in Jan 2026;
      # same service, resource type, and endpoints): the certificate is
      # short-lived, issued and rotated by Microsoft, and the private key
      # never exists outside their HSM. The runner only holds a service
      # principal credential, revocable in Entra without touching the signing
      # setup. The three non-secret values are repository variables so a
      # rotation or region change is visible without decrypting anything.
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
      AZURE_SIGNING_ACCOUNT_NAME: ${{ vars.AZURE_SIGNING_ACCOUNT_NAME }}
      AZURE_CERT_PROFILE_NAME: ${{ vars.AZURE_CERT_PROFILE_NAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify Windows signing secrets
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in \
            AZURE_TENANT_ID \
            AZURE_CLIENT_ID \
            AZURE_CLIENT_SECRET \
            AZURE_SIGNING_ENDPOINT \
            AZURE_SIGNING_ACCOUNT_NAME \
            AZURE_CERT_PROFILE_NAME; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            printf '::error::Tagged Windows releases require these Azure Trusted Signing settings: %s\n' "${missing[*]}"
            exit 1
          fi

      - name: Allow unsigned build when credentials are absent
        # Lets the release workflow run end-to-end on a forked or secrets-less
        # repo for verification. The installer won't be publishable but the
        # packaging path itself is exercised. Tag builds never reach this step
        # because the secret check above already failed the job.
        if: ${{ github.event_name == 'workflow_dispatch' && env.AZURE_CLIENT_SECRET == '' }}
        shell: bash
        run: echo "OPENADMINOS_ALLOW_UNSIGNED_WINDOWS=1" >> "$GITHUB_ENV"

      - name: Prepare Azure Artifact Signing
        # Installs the PowerShell module the sign hook invokes per file. The
        # module keeps the service's pre-rename name (TrustedSigning); it is
        # frozen but not deprecated, talks to the unchanged
        # *.codesigning.azure.net endpoints, and is what electron-builder and
        # T3 Code ship with in production today. Its successor module is
        # ArtifactSigning/Invoke-ArtifactSigning; migrate once it is as
        # field-proven. The PSModulePath pin matters: the hook runs pwsh
        # -NoProfile from inside electron-builder, and without the pin that
        # child shell can fail to resolve Invoke-TrustedSigning even though
        # this step installed it (T3 Code hit exactly this in production).
        if: ${{ env.AZURE_CLIENT_SECRET != '' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser | Out-Null
          } catch {
            Write-Output "NuGet package provider already available: $($_.Exception.Message)"
          }
          Install-Module -Name TrustedSigning -MinimumVersion 0.5.0 -Force -AllowClobber -Repository PSGallery -Scope CurrentUser
          Import-Module TrustedSigning
          if (-not (Get-Command Invoke-TrustedSigning -ErrorAction SilentlyContinue)) {
            Write-Output "::error::Invoke-TrustedSigning is not resolvable after installing the TrustedSigning module."
            exit 1
          }
          Add-Content -Path $env:GITHUB_ENV -Value "PSModulePath=$env:PSModulePath"

      - name: Add Windows SDK signtool to PATH
        # The sign hook runs signtool verify /pa after each file so a pass
        # means Windows itself accepts the signature, but the runner image's
        # Windows SDK does not put signtool.exe on PATH.
        if: ${{ env.AZURE_CLIENT_SECRET != '' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\10.*\x64\signtool.exe' -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signtool) {
            Write-Output "::error::signtool.exe was not found under the Windows SDK path on this runner."
            exit 1
          }
          Write-Output "Using $($signtool.FullName)"
          Add-Content -Path $env:GITHUB_PATH -Value $signtool.DirectoryName

      - name: Build signed NSIS installer
        run: npm run dist -w @openadminos/desktop -- --win --x64 --publish never

      - name: Verify Windows build output
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          $OutputEncoding = [Console]::OutputEncoding

          $installers = @(Get-ChildItem -Path apps/desktop/release -Filter *.exe -File)
          if ($installers.Count -eq 0) {
            Write-Output "::error::Windows build completed but no .exe installer was produced."
            exit 1
          }
          if ($installers.Count -ne 1) {
            Write-Output "::error::Expected exactly one Windows .exe installer, found $($installers.Count): $($installers.Name -join ', ')."
            exit 1
          }
          $installer = $installers[0]

          $latestYml = 'apps/desktop/release/latest.yml'
          if (-not (Test-Path -Path $latestYml -PathType Leaf)) {
            Write-Output "::error::Windows build completed but apps/desktop/release/latest.yml is missing. electron-updater needs it for Windows auto-update."
            exit 1
          }

          # publisherName lands in the packaged app's app-update.yml, the file
          # electron-updater reads when verifying a downloaded update, not in
          # latest.yml, which only carries version and hash metadata. Without
          # it, update signature verification is silently skipped.
          $appUpdateYml = 'apps/desktop/release/win-unpacked/resources/app-update.yml'
          if (-not (Test-Path -Path $appUpdateYml -PathType Leaf)) {
            Write-Output "::error::$appUpdateYml is missing, so the packaged app has no update configuration."
            exit 1
          }
          $appUpdateText = Get-Content -Path $appUpdateYml -Raw -Encoding UTF8
          if ($appUpdateText -notmatch '(?m)^publisherName:\s*') {
            Write-Output "::error::app-update.yml has no publisherName entry. electron-updater would silently skip signature verification for downloaded Windows updates. Check win.signtoolOptions.publisherName in apps/desktop/package.json."
            exit 1
          }

          if ($env:OPENADMINOS_ALLOW_UNSIGNED_WINDOWS -ne '1') {
            $expectedPublisher = 'Ugurlabs UG (haftungsbeschränkt)'
            $signature = Get-AuthenticodeSignature -FilePath $installer.FullName
            if ($signature.Status -ne 'Valid') {
              Write-Output "::error::Authenticode signature on $($installer.Name) is '$($signature.Status)': $($signature.StatusMessage)"
              exit 1
            }

            $actualSubject = $signature.SignerCertificate.Subject
            $actualPublisher = $signature.SignerCertificate.GetNameInfo(
              [System.Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false)
            if ($actualPublisher -ne $expectedPublisher) {
              Write-Output "::error::Windows signer certificate CN mismatch. Expected CN '$expectedPublisher'. Actual CN '$actualPublisher'. Actual subject '$actualSubject'. Update win.signtoolOptions.publisherName in apps/desktop/package.json to the actual value."
              exit 1
            }

            # The sign hook deliberately skips the bundled MXC SDK binaries so
            # they keep Microsoft's Authenticode signature instead of ours.
            # Prove that assumption here: every one of them must still carry a
            # valid vendor signature, or the skip would be shipping unsigned
            # third-party executables.
            $thirdParty = @(Get-ChildItem -Path 'apps/desktop/release/win-unpacked/resources/native/mxc-sdk' -Recurse -Filter *.exe -File -ErrorAction SilentlyContinue)
            if ($thirdParty.Count -eq 0) {
              Write-Output "::error::No MXC SDK executables found in the unpacked app. The sign hook's third-party skip list may be stale relative to the packaged layout."
              exit 1
            }
            foreach ($binary in $thirdParty) {
              $vendorSig = Get-AuthenticodeSignature -FilePath $binary.FullName
              if ($vendorSig.Status -ne 'Valid') {
                Write-Output "::error::$($binary.Name) was skipped by the sign hook but has no valid vendor signature (status '$($vendorSig.Status)'). It must either ship vendor-signed or be removed from the hook's skip list."
                exit 1
              }
            }
            Write-Output "Verified $($thirdParty.Count) skipped MXC SDK binaries still carry valid vendor signatures."
          } else {
            Write-Output "Built $($installer.Name) UNSIGNED because OPENADMINOS_ALLOW_UNSIGNED_WINDOWS=1; skipping Authenticode verification."
          }

          Write-Output "Built Windows artifacts:"
          Get-ChildItem -Path apps/desktop/release -File |
            Sort-Object Name |
            ForEach-Object { Write-Output "  $($_.FullName)" }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/latest.yml
          if-no-files-found: error
          retention-days: 7

  macos-arm64:
    name: macOS (Apple Silicon) — signed + notarized
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.backfill_apt_tag != '') }}
    needs: release-gate
    runs-on: macos-26
    timeout-minutes: 30
    env:
      # electron-builder reads these to authenticate notarization +
      # certificate import. CSC_LINK can be a https URL or a base64
      # blob; we use the base64 path so no external storage is needed.
      # APPLE_TEAM_ID is not secret (it's printed on the cert) so it
      # lives inline rather than in repo secrets.
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      CSC_INSTALLER_LINK: ${{ secrets.CSC_INSTALLER_LINK }}
      CSC_INSTALLER_KEY_PASSWORD: ${{ secrets.CSC_INSTALLER_KEY_PASSWORD }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_TEAM_ID: "D259ULY2B4"
      OPENADMINOS_REQUIRE_APPLE_FOUNDATION_HELPER: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify macOS release signing and notarization secrets
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          APPLE_API_KEY_CONTENTS: ${{ secrets.APPLE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in \
            CSC_LINK \
            CSC_KEY_PASSWORD \
            CSC_INSTALLER_LINK \
            CSC_INSTALLER_KEY_PASSWORD \
            APPLE_API_KEY_CONTENTS \
            APPLE_API_KEY_ID \
            APPLE_API_ISSUER; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            printf '::error::Tagged macOS releases require these signing/notarization secrets: %s\n' "${missing[*]}"
            exit 1
          fi

      - name: Write App Store Connect API key
        # electron-builder expects APPLE_API_KEY to be a path to a .p8
        # file on disk. We materialize the secret contents to a tempfile
        # and rewrite APPLE_API_KEY to point at it.
        if: ${{ env.APPLE_API_KEY_ID != '' }}
        env:
          APPLE_API_KEY_CONTENTS: ${{ secrets.APPLE_API_KEY }}
        run: |
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_CONTENTS" > "$key_path"
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"

      - name: Disable signing if secrets are missing
        # Lets the release workflow run end-to-end on a forked or
        # secrets-less repo for verification. Artifacts won't be
        # publishable but the build path itself is exercised.
        if: ${{ github.event_name == 'workflow_dispatch' && env.CSC_LINK == '' }}
        run: |
          echo "CSC_LINK=" >> "$GITHUB_ENV"
          echo "CSC_KEY_PASSWORD=" >> "$GITHUB_ENV"
          echo "CSC_INSTALLER_LINK=" >> "$GITHUB_ENV"
          echo "CSC_INSTALLER_KEY_PASSWORD=" >> "$GITHUB_ENV"
          echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"

      - name: Verify PKG installer signing secrets
        if: ${{ env.CSC_LINK != '' && (env.CSC_INSTALLER_LINK == '' || env.CSC_INSTALLER_KEY_PASSWORD == '') }}
        run: |
          echo "::error::macOS PKG publishing requires CSC_INSTALLER_LINK and CSC_INSTALLER_KEY_PASSWORD for a Developer ID Installer certificate."
          exit 1

      - name: Correct electron-builder macOS keychain password handling
        run: node scripts/patch-macos-signing.mjs

      - name: Build .dmg + .pkg + .zip (signed + notarized when secrets present)
        # Arch is declared in package.json build.mac.target, so we only
        # pass --mac on the CLI; passing --arm64 here would be redundant
        # and (with some electron-builder versions) override the config.
        run: npm run dist -w @openadminos/desktop -- --mac --publish never

      - name: Verify Apple Foundation helper was packaged
        shell: bash
        run: |
          set -euo pipefail
          helper="$(find apps/desktop/release -path '*/OpenAdminOS.app/Contents/Resources/native/apple-foundation-helper/openadminos-apple-foundation-helper' -type f -print -quit)"
          if [ -z "$helper" ]; then
            echo "::error::Apple Foundation helper was not found in the packaged app bundle."
            find apps/desktop/release -maxdepth 5 -type f | sort
            exit 1
          fi
          if [ ! -x "$helper" ]; then
            echo "::error::Apple Foundation helper exists but is not executable: $helper"
            exit 1
          fi
          file "$helper"
          otool -L "$helper" | tee "$RUNNER_TEMP/apple-foundation-helper-otool.txt"
          grep -q 'FoundationModels.framework' "$RUNNER_TEMP/apple-foundation-helper-otool.txt"
          if [ -n "${CSC_LINK:-}" ]; then
            codesign --verify --strict --verbose=2 "$helper"
          fi

      - name: Verify MXC macOS executor was packaged
        shell: bash
        run: |
          set -euo pipefail
          executor="$(find apps/desktop/release -path '*/OpenAdminOS.app/Contents/Resources/native/mxc-sdk/bin/arm64/mxc-exec-mac' -type f -print -quit)"
          if [ -z "$executor" ]; then
            echo "::error::MXC macOS executor was not found in the packaged app bundle."
            find apps/desktop/release -path '*/native/mxc-sdk/*' -print | sort
            exit 1
          fi
          if [ ! -x "$executor" ]; then
            echo "::error::MXC macOS executor exists but is not executable: $executor"
            exit 1
          fi
          file "$executor"
          if [ -n "${CSC_LINK:-}" ]; then
            codesign --verify --strict --verbose=2 "$executor"
          fi

      - name: Verify menu bar login helper was packaged
        shell: bash
        run: |
          set -euo pipefail
          app_icon="$(find apps/desktop/release -path '*/OpenAdminOS.app/Contents/Resources/app-icon.png' -type f -print -quit)"
          if [ -z "$app_icon" ]; then
            echo "::error::OpenAdminOS app icon resource for the menu bar status item was not found."
            find apps/desktop/release -maxdepth 6 -type f | sort
            exit 1
          fi
          file "$app_icon"
          helper_app="$(find apps/desktop/release -path '*/OpenAdminOS.app/Contents/Library/LoginItems/OpenAdminOS Menu Bar Helper.app' -type d -print -quit)"
          if [ -z "$helper_app" ]; then
            echo "::error::Menu bar login helper was not found in the packaged app bundle."
            find apps/desktop/release -maxdepth 7 -type d | sort
            exit 1
          fi
          executable="$helper_app/Contents/MacOS/OpenAdminOS Menu Bar Helper"
          plist="$helper_app/Contents/Info.plist"
          if [ ! -x "$executable" ]; then
            echo "::error::Menu bar login helper exists but is not executable: $executable"
            exit 1
          fi
          plutil -extract CFBundleIdentifier raw "$plist" | grep -qx 'com.openadminos.desktop.menubar-helper'
          plutil -extract CFBundleIconFile raw "$plist" | grep -qx 'OpenAdminOS'
          plutil -extract LSUIElement raw "$plist" | grep -qx 'true'
          icon="$helper_app/Contents/Resources/OpenAdminOS.icns"
          if [ ! -f "$icon" ]; then
            echo "::error::Menu bar login helper icon was not found: $icon"
            exit 1
          fi
          file "$icon"
          file "$executable"
          if [ -n "${CSC_LINK:-}" ]; then
            codesign --verify --strict --verbose=2 "$helper_app"
          fi

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.pkg
            apps/desktop/release/*.zip
            apps/desktop/release/latest-mac.yml
          if-no-files-found: error
          retention-days: 7

  linux-x64:
    name: Linux x64 — AppImage, deb, rpm
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.backfill_apt_tag != '') }}
    needs: release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify Linux repository signing secrets
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${APT_GPG_PRIVATE_KEY:-}" ]; then
            echo "::error::Tagged Linux releases require the APT_GPG_PRIVATE_KEY repository-signing secret."
            exit 1
          fi

      - name: Build AppImage + deb + rpm
        run: npm run dist -w @openadminos/desktop -- --linux --x64 --publish never

      - name: Verify Linux build output
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          appimages=(apps/desktop/release/*.AppImage)
          debs=(apps/desktop/release/*.deb)
          rpms=(apps/desktop/release/*.rpm)

          if [ "${#appimages[@]}" -eq 0 ]; then
            echo "::error::Linux build completed but no AppImage was produced." >&2
            exit 1
          fi

          if [ "${#debs[@]}" -eq 0 ]; then
            echo "::error::Linux build completed but no .deb was produced." >&2
            exit 1
          fi

          if [ "${#rpms[@]}" -eq 0 ]; then
            echo "::error::Linux build completed but no .rpm was produced." >&2
            exit 1
          fi

          printf 'Built Linux artifacts:\n'
          printf '  %s\n' "${appimages[@]}" "${debs[@]}" "${rpms[@]}"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.rpm
            apps/desktop/release/latest-linux.yml
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish release
    needs: [windows-x64, macos-arm64, linux-x64]
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: ls -R artifacts

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find artifacts -type f \( \
            -name '*.exe' -o \
            -name '*.dmg' -o \
            -name '*.pkg' -o \
            -name '*.zip' -o \
            -name '*.AppImage' -o \
            -name '*.deb' -o \
            -name '*.rpm' -o \
            -name 'latest.yml' -o \
            -name 'latest-mac.yml' -o \
            -name 'latest-linux.yml' \
          \) -print0 | while IFS= read -r -d '' file; do
            cp "$file" "release-assets/$(basename "$file")"
          done

          asset_count=$(find release-assets -type f | wc -l | tr -d ' ')
          if [ "$asset_count" -eq 0 ]; then
            echo "::error::No publishable release assets were downloaded." >&2
            exit 1
          fi

          ls -la release-assets

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          set -euo pipefail
          (
            cd release-assets
            find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -printf '%f\0' \
              | sort -z \
              | xargs -0 sha256sum -- > SHA256SUMS.txt
          )
          cat release-assets/SHA256SUMS.txt

      - name: Extract release notes from CHANGELOG
        id: notes
        shell: bash
        # TAG_NAME is sourced from github.ref_name via env so it's a
        # plain $VAR shell expansion, not a templated string — keeps
        # the workflow injection-safe per
        # https://github.blog/security/vulnerability-research/how-to-catch-github-actions-workflow-injections-before-attackers-do/
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Refuse anything that isn't strict semver — defence in depth
          # against an attacker pushing a tag like "v0.1.8;evil" to a
          # fork PR. (We already gate on refs/tags/v* above, but a
          # belt-and-braces second check is cheap.)
          if ! printf '%s' "$TAG_NAME" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+([.-][[:alnum:].-]+)?$'; then
            echo "::error::Refusing to extract notes — tag '$TAG_NAME' does not match strict semver." >&2
            exit 1
          fi
          version="${TAG_NAME#v}"
          notes=$(awk -v ver="$version" '
            BEGIN { capture = 0 }
            /^## \[/ {
              if (capture == 1) { exit }
              if ($0 ~ ("^## \\[" ver "\\]")) { capture = 1; next }
            }
            capture == 1 { print }
          ' CHANGELOG.md)
          if [ -z "$notes" ]; then
            echo "::error::No CHANGELOG section found for $version. Add ## [$version] to CHANGELOG.md before publishing a release." >&2
            exit 1
          fi

          {
            echo 'body<<RELEASE_NOTES_EOF'
            if [ -n "$notes" ]; then
              printf '%s\n\n' "$notes"
            fi
            printf '### SHA256 checksums\n\n'
            printf '```text\n'
            cat release-assets/SHA256SUMS.txt
            printf '```\n'
            echo RELEASE_NOTES_EOF
          } >> "$GITHUB_OUTPUT"

      - name: Publish release (with CHANGELOG body)
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          make_latest: true
          overwrite_files: true
          body: ${{ steps.notes.outputs.body }}
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-apt-repository:
    name: Publish apt repository
    needs: [publish-release]
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-x64
          path: linux-artifacts

      - name: Install apt repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apt-utils dpkg-dev gnupg

      - name: Build signed apt repository
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
          APT_REPO_DOMAIN: repo.openadminos.com
          APT_REPO_CNAME: repo.openadminos.com
        run: bash scripts/build-apt-repository.sh linux-artifacts apt-pages

      - name: Upload apt repository artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apt-pages

      - name: Deploy apt repository to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  backfill-apt-repository:
    name: Backfill apt repository
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.backfill_apt_tag != '' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate backfill tag
        env:
          BACKFILL_TAG: ${{ inputs.backfill_apt_tag }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$BACKFILL_TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+([.-][[:alnum:].-]+)?$'; then
            echo "::error::Refusing apt backfill for invalid tag '$BACKFILL_TAG'."
            exit 1
          fi

      - name: Install apt repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apt-utils dpkg-dev gnupg

      - name: Download release .deb
        env:
          BACKFILL_TAG: ${{ inputs.backfill_apt_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p linux-artifacts
          gh release download "$BACKFILL_TAG" \
            --repo OpenAdminOS/OpenAdminOS \
            --pattern '*linux-amd64.deb' \
            --dir linux-artifacts
          ls -la linux-artifacts

      - name: Build signed apt repository
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
          APT_REPO_DOMAIN: repo.openadminos.com
          APT_REPO_CNAME: repo.openadminos.com
        run: bash scripts/build-apt-repository.sh linux-artifacts apt-pages

      - name: Upload apt repository artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apt-pages

      - name: Deploy apt repository to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
