name: Auto-tag release versions

# This workflow decides what the current green main commit ships:
#
#   - Stable: the repository version has no tag and STABLE_RELEASE_APPROVED
#     equals that version. It pushes the tag and dispatches release.yml against it.
#   - Nightly: stable is not due and an app path changed since the newest
#     v* tag of either channel. It dispatches release.yml on main with
#     nightly_sha set; release.yml computes the nightly version and creates the
#     prerelease tag only when it publishes. Comparing with the newest tag
#     rather than the parent commit means a merge whose CI was cancelled by a
#     later push (the hourly install-stats commit, for example) still ships in
#     the next nightly.
#   - Nothing: stable is not due and no app paths changed.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  # Dispatching release.yml uses the workflow dispatch API, which needs
  # actions:write in addition to contents:write.
  actions: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  tag:
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.event == 'push' &&
           github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Verify the checkout is current main
        id: current
        run: |
          set -euo pipefail
          git fetch origin refs/heads/main:refs/remotes/origin/main
          green_sha="$(git rev-parse HEAD)"
          main_sha="$(git rev-parse origin/main)"
          if [ "$green_sha" != "$main_sha" ]; then
            echo "::notice::Skipping $green_sha because main has advanced to $main_sha; its CI run will decide tagging."
            echo "matches=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "sha=$green_sha" >> "$GITHUB_OUTPUT"
          echo "matches=true" >> "$GITHUB_OUTPUT"

      - name: Verify CI passed before a manual run
        if: ${{ github.event_name == 'workflow_dispatch' && steps.current.outputs.matches == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAIN_SHA: ${{ steps.current.outputs.sha }}
        run: |
          set -euo pipefail
          conclusion="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
            --branch main --event push --commit "$MAIN_SHA" --limit 1 \
            --json conclusion --jq '.[0].conclusion // ""')"
          if [ "$conclusion" != success ]; then
            echo "::error::CI has not passed for main commit $MAIN_SHA. Wait for green CI, then run this workflow again." >&2
            exit 1
          fi

      - name: Decide release channel
        id: decision
        if: ${{ steps.current.outputs.matches == 'true' }}
        env:
          STABLE_RELEASE_APPROVED: ${{ vars.STABLE_RELEASE_APPROVED }}
        run: bash scripts/decide-release.sh

      - name: Push tag
        if: ${{ steps.decision.outputs.channel == 'stable' }}
        env:
          TAG: v${{ steps.decision.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "OpenAdminOS $TAG"
          git push origin "$TAG"
          echo "Pushed $TAG."

      - name: Dispatch release workflow
        if: ${{ steps.decision.outputs.channel == 'stable' }}
        # Release runs only on dispatch. Use a fully qualified tag ref to
        # avoid selecting a branch with the same name.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.decision.outputs.version }}
        run: |
          set -euo pipefail
          gh workflow run release.yml --ref "refs/tags/$TAG"
          echo "Dispatched release.yml for $TAG."

      - name: Dispatch nightly build
        if: ${{ steps.decision.outputs.channel == 'nightly' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NIGHTLY_SHA: ${{ steps.current.outputs.sha }}
        run: |
          set -euo pipefail
          gh workflow run release.yml --ref main -f nightly_sha="$NIGHTLY_SHA"
          echo "Dispatched a nightly build of $NIGHTLY_SHA."
