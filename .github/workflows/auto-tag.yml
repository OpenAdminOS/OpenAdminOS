name: Auto-tag release versions

# After CI succeeds on main, this workflow decides what the green commit ships:
#
#   - Stable: the repository version has no tag yet (a release-prep merge).
#     It pushes the tag and dispatches release.yml against it. Waiting for
#     green CI is important because a squash merge can change path-specific
#     generated-doc metadata; the documentation workflow may need to land its
#     reconciliation PR before the release source is ready to tag.
#   - Nightly: the version is already tagged and an app path changed since the
#     newest v* tag of either channel. It dispatches release.yml on main with
#     nightly_sha set; release.yml computes the nightly version and creates the
#     prerelease tag only when it publishes. Comparing with the newest tag
#     rather than the parent commit means a merge whose CI was cancelled by a
#     later push (the hourly install-stats commit, for example) still ships in
#     the next nightly.
#   - Nothing: the version is tagged and only non-app paths changed.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  # The "Dispatch release workflow" step calls
  # `gh workflow run release.yml`, which goes through the
  # repos/.../actions/workflows/release.yml/dispatches endpoint —
  # that needs actions:write, separate from contents:write.
  actions: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  tag:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Verify the green commit is still current
        id: current
        run: |
          set -euo pipefail
          git fetch origin refs/heads/main:refs/remotes/origin/main
          green_sha="$(git rev-parse HEAD)"
          main_sha="$(git rev-parse origin/main)"
          if [ "$green_sha" != "$main_sha" ]; then
            echo "::notice::Skipping $green_sha because main has advanced to $main_sha; its CI run will decide tagging."
            echo "matches=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "matches=true" >> "$GITHUB_OUTPUT"

      - name: Resolve tag
        id: tag
        if: ${{ steps.current.outputs.matches == 'true' }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if ! printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+([.-][[:alnum:].-]+)?$'; then
            echo "::error::package.json contains an invalid release version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify tag doesn't already exist
        id: existing
        if: ${{ steps.current.outputs.matches == 'true' }}
        env:
          TAG: v${{ steps.tag.outputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::warning::Tag $TAG already exists locally — skipping."
            echo "exists=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "$TAG" >/dev/null 2>&1; then
            echo "::warning::Tag $TAG already exists on origin — skipping."
            echo "exists=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "exists=false" >> "$GITHUB_OUTPUT"

      - name: Push tag
        if: ${{ steps.current.outputs.matches == 'true' && steps.existing.outputs.exists != 'true' }}
        env:
          TAG: v${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "OpenAdminOS $TAG"
          git push origin "$TAG"
          echo "Pushed $TAG."

      - name: Dispatch release workflow
        if: ${{ steps.current.outputs.matches == 'true' && steps.existing.outputs.exists != 'true' }}
        # The tag push above does NOT trigger release.yml on its own —
        # GitHub deliberately suppresses workflow chaining when one
        # workflow's GITHUB_TOKEN is the actor that pushed (anti-loop
        # safeguard). So we dispatch release.yml explicitly here,
        # against the freshly-pushed tag.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          gh workflow run release.yml --ref "refs/tags/$TAG"
          echo "Dispatched release.yml for $TAG."

      - name: Decide whether main needs a nightly build
        id: nightly
        if: ${{ steps.current.outputs.matches == 'true' && steps.existing.outputs.exists == 'true' }}
        run: |
          set -euo pipefail
          changed="$(bash scripts/nightly-app-changes.sh HEAD)"
          if [ -z "$changed" ]; then
            echo "::notice::No app changes since the newest v* tag; skipping the nightly build."
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A nightly that is still building has not tagged its commit yet,
          # so later green commits (the hourly install-stats commit, for
          # example) dispatch again. release.yml queues those runs behind the
          # running one and skips them when nothing is left to build.
          echo "App changes:"
          # sed reads all of its input; head would close the pipe early and
          # fail this step under pipefail when many paths changed.
          printf '%s\n' "$changed" | sed -n '1,50p'
          echo "build=true" >> "$GITHUB_OUTPUT"

      - name: Dispatch nightly build
        if: ${{ steps.nightly.outputs.build == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NIGHTLY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          gh workflow run release.yml --ref main -f nightly_sha="$NIGHTLY_SHA"
          echo "Dispatched a nightly build of $NIGHTLY_SHA."
