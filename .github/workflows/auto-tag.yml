name: Auto-tag release versions

# After CI succeeds on main, this workflow reads the repository version and
# pushes the matching tag when it does not exist yet. Waiting for green CI is
# important because a squash merge can change path-specific generated-doc
# metadata; the documentation workflow may need to land its reconciliation PR
# before the release source is ready to tag.
#
# Day-to-day merges are harmless because their package version already has a
# tag. A release-prep merge introduces the next untagged version.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  # The "Dispatch release workflow" step calls
  # `gh workflow run release.yml --ref vX.Y.Z`, which goes through the
  # repos/.../actions/workflows/release.yml/dispatches endpoint —
  # that needs actions:write, separate from contents:write.
  actions: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  tag:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Verify the green commit is still current
        id: current
        run: |
          set -euo pipefail
          git fetch origin refs/heads/main:refs/remotes/origin/main
          green_sha="$(git rev-parse HEAD)"
          main_sha="$(git rev-parse origin/main)"
          if [ "$green_sha" != "$main_sha" ]; then
            echo "::notice::Skipping $green_sha because main has advanced to $main_sha; its CI run will decide tagging."
            echo "matches=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "matches=true" >> "$GITHUB_OUTPUT"

      - name: Resolve tag
        id: tag
        if: ${{ steps.current.outputs.matches == 'true' }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if ! printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+([.-][[:alnum:].-]+)?$'; then
            echo "::error::package.json contains an invalid release version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify tag doesn't already exist
        id: existing
        if: ${{ steps.current.outputs.matches == 'true' }}
        env:
          TAG: v${{ steps.tag.outputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::warning::Tag $TAG already exists locally — skipping."
            echo "exists=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "$TAG" >/dev/null 2>&1; then
            echo "::warning::Tag $TAG already exists on origin — skipping."
            echo "exists=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "exists=false" >> "$GITHUB_OUTPUT"

      - name: Push tag
        if: ${{ steps.current.outputs.matches == 'true' && steps.existing.outputs.exists != 'true' }}
        env:
          TAG: v${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "OpenAdminOS $TAG"
          git push origin "$TAG"
          echo "Pushed $TAG."

      - name: Dispatch release workflow
        if: ${{ steps.current.outputs.matches == 'true' && steps.existing.outputs.exists != 'true' }}
        # The tag push above does NOT trigger release.yml on its own —
        # GitHub deliberately suppresses workflow chaining when one
        # workflow's GITHUB_TOKEN is the actor that pushed (anti-loop
        # safeguard). So we dispatch release.yml explicitly here,
        # against the freshly-pushed tag.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          gh workflow run release.yml --ref "refs/tags/$TAG"
          echo "Dispatched release.yml for $TAG."
