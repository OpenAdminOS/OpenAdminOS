# yaml-language-server: $schema=../../schemas/agent-template.schema.json
#
# conditional-access-explainer: loads every Conditional Access policy in
# the tenant and asks the LLM to explain what the policies do, where
# coverage, exclusions and report-only controls leave gaps against common
# Zero Trust baselines, and what to change. The prompt carries one compact
# record per policy (compact-conditional-access), not the Graph objects,
# so a 100 policy tenant still fits a 16k context local model.
descriptor:
  id: conditional-access-explainer
  name: Conditional Access explainer
  description: Reviews Conditional Access policies for coverage, exclusions, report-only controls, overlaps, and common Zero Trust gaps.
  version: 1.2.0
  # TODO(ugur): set to the first published nightly whose tagged commit
  # contains the merged #214 runtime, then bump agents/registry-revision.txt
  # and regenerate the index and docs. Until then no nightly accepts this
  # manifest (any 0.7.3 nightly is below this stamp), and the 0.7.3 release,
  # which contains #214, does.
  minAppVersion: 0.7.3-nightly.99999999999999
  author:
    name: OpenAdminOS
    handle: openadminos
    verified: true
  category: policies
  tier: agent
  requiresEntraTier: p1
  services:
    - entra
  mode: read
  preferredModel: llama3.1:8b

skills:
  - id: load_policies
    format: graph
    label: Load all Conditional Access policies
    detail: Reads every CA policy in the tenant via Microsoft Graph.
    settings:
      method: GET
      path: /identity/conditionalAccess/policies
      select:
        - id
        - displayName
        - createdDateTime
        - modifiedDateTime
        - state
        - conditions
        - grantControls
        - sessionControls
      scopes:
        - Policy.Read.All

  - id: by_state
    format: transform
    label: Count policies by state
    settings:
      kind: count-by-field
      source: "{{ load_policies.output }}"
      field: state

  - id: by_grant_operator
    format: transform
    label: Count policies by grant operator
    settings:
      kind: count-by-field
      source: "{{ load_policies.output }}"
      field: grantControls.operator
      missingBucket: "(no grant controls)"

  - id: by_client_apps
    format: transform
    label: Count policies by client app types
    settings:
      kind: count-by-field
      source: "{{ load_policies.output }}"
      field: conditions.clientAppTypes
      missingBucket: "(not scoped)"

  - id: by_signin_risk
    format: transform
    label: Count policies by sign-in risk condition
    settings:
      kind: count-by-field
      source: "{{ load_policies.output }}"
      field: conditions.signInRiskLevels
      missingBucket: "(none)"

  - id: by_user_risk
    format: transform
    label: Count policies by user risk condition
    settings:
      kind: count-by-field
      source: "{{ load_policies.output }}"
      field: conditions.userRiskLevels
      missingBucket: "(none)"

  - id: by_modified_age
    format: transform
    label: Group policies by modification age
    settings:
      kind: group-by-age
      source: "{{ load_policies.output }}"
      timestampField: modifiedDateTime
      # Graph returns null for a policy never modified after creation.
      fallbackTimestampField: createdDateTime
      # Names only, so no policy record appears twice in the review prompt.
      pick: displayName
      groups:
        - name: "not modified in 2y+"
          inactiveDaysAtLeast: 730
        - name: "not modified in 1y+"
          inactiveDaysAtLeast: 365
        - name: "not modified in 180d+"
          inactiveDaysAtLeast: 180

  - id: compact_policies
    format: transform
    label: Summarize each policy for review
    detail: One short record per policy with its scope, conditions and controls.
    settings:
      kind: compact-conditional-access
      source: "{{ load_policies.output }}"

  - id: explain
    format: llm
    label: Review Conditional Access posture
    detail: Coverage, interaction, exclusion, and Zero Trust gap review.
    when: ctx.llm.available
    settings:
      system: >-
        You are an Entra Conditional Access expert reviewing a real tenant
        policy set for a Microsoft 365 admin. Explain in plain words what the
        policies do and give specific, actionable improvements. Be factual and
        skeptical. Never invent policies, users, groups, apps, roles or
        controls. Use only the policy records given. Treat report-only
        (enabledForReportingButNotEnforced) and disabled policies as not
        enforcing protection, and keep the two apart. Treat exclusions as risk
        evidence. Group, user, app and location counts are counts of object
        ids, not resolved memberships, so never state how many people a
        policy covers. When the records do not prove coverage, say "not
        proven from this policy set". The inventory has no sign-in logs, so it
        cannot show whether enforcing a policy is safe.
      prompt: |-
        The tenant has {{ load_policies.output | size }} Conditional Access policies.
        By state: {{ by_state.output }}.
        Grant operator breakdown: {{ by_grant_operator.output }}.
        Client app type breakdown: {{ by_client_apps.output }}.
        Sign-in risk condition breakdown: {{ by_signin_risk.output }}.
        User risk condition breakdown: {{ by_user_risk.output }}.
        Policies not modified for a long time, by name: {{ by_modified_age.output }}.

        Policy records. Fields: name; state; modifiedDaysAgo; users.include and
        users.exclude (users: "All", "None", "GuestsOrExternalUsers" or a count;
        groups: count of groups; roles: directory role names, plus "N other
        roles" for roles the app does not name; guests: guest types);
        workloadIdentities (service principals the policy targets instead of
        users); apps.include and apps.exclude ("All", "None", "Office365", a
        named app or a count), apps.userActions, apps.agentActions (count of
        agent actions the policy targets), apps.authContexts (count of
        authentication contexts), apps.appFilter (an app filter narrows the
        apps); clientAppTypes (absent means all client apps); platforms and
        locations, each with include and exclude (absent means not limited;
        locations are "All", "AllTrusted" or a count of named locations);
        signInRisk, userRisk, servicePrincipalRisk and insiderRisk levels;
        deviceStates (include and exclude, such as excluding Compliant or
        DomainJoined devices); deviceFilter; authFlows; otherConditions (further conditions that are
        set and narrow the policy); grant (operator when there are several
        requirements, controls such as mfa, block, compliantDevice,
        domainJoinedDevice, compliantApplication, approvedApplication,
        passwordChange; authStrength with name, type builtIn or custom, and
        satisfies, where "mfa" counts as MFA and "none" or a missing value
        does not prove it; termsOfUse count); session (session
        controls). Grant controls decide access; session controls change the
        session after sign-in and apply even without grant controls. A policy
        with neither changes nothing.
        {{ compact_policies.output }}

        Write the review in this exact shape, in plain admin language, in
        under 700 words. Cite policy names in quotes for every claim, and
        name at most three policies per bullet ("and N more" for the rest).

        1. Summary.
        Two or three sentences: the overall posture and the single most
        important risk.

        2. Recommended changes.
        Three to five numbered, concrete changes, most important first. Each
        says which policy to change or create, the exact setting (for example
        "add exchangeActiveSync and other to client apps and grant Block", or
        "require the Phishing-resistant MFA authentication strength for the
        privileged roles"), and why. For any change that enforces something,
        add the check to do first, and keep the existing policy enforced
        while you check: test a proposed edit as a new report-only copy of
        the policy and review its sign-in impact; for user actions such as
        registering security info, which report-only does not show, test
        with a separately scoped, approved pilot group. Never suggest
        switching an enforced policy to report-only. Keep emergency access
        accounts excluded. Do not claim a change is safe to enforce from
        this inventory alone.

        3. Coverage.
        One bullet each for admin MFA, all-user MFA, legacy authentication
        block, device compliance, guest and external access, risky sign-ins
        and users, and session controls. Say covered, partially covered, or
        not proven, and name the policies and the reason. Under grant, OR
        means any one listed requirement satisfies the policy, so MFA is
        required only when it is the sole requirement or the operator is AND.

        4. Gaps and conflicts.
        Three to six bullets. Each names the policies involved and the
        evidence: an exclusion, a report-only or disabled state, a missing
        control, client apps or platforms left out, or two policies that
        overlap in a way that has a concrete effect. Policies that apply to
        the same sign-in add up: each enforced policy must be satisfied by
        its own grant operator (AND needs all of its controls, OR needs one),
        and a block in any of them blocks. So an MFA policy and a policy
        requiring a compliant or hybrid joined device together need MFA plus
        one of the two device controls; they are cumulative, not a conflict; report a conflict only when the combined effect is
        concrete (for example a block that also catches the admins another
        policy protects). Call two policies overlapping only
        when the records show a shared value in every scope they set: for
        users, apps, client app types, platforms, locations and conditions,
        some value is in both (or one says "All"), after each policy's
        exclusions. A partial overlap counts (Windows and iOS against iOS
        and macOS share iOS). One shared field alone is not enough (browser
        access to Office365 on Windows and on iOS does not overlap). Matching counts ("2 groups",
        "1 named location"), matching filter modes and shortened device
        filter rules do not show that two policies cover the same objects,
        and neither do matching otherConditions names, which carry no
        values, so treat that scope as unresolved and ask the admin to
        compare those policies in Entra. Mention policies not
        modified for over a year when they matter.

        5. What the policies do.
        One bullet per purpose (admin protection, MFA for users, legacy
        authentication, device and app requirements, guests and external
        users, risk-based, session controls, other) that has policies: who
        they apply to, what they require, their state, and up to three
        example policy names.
      temperature: 0.2
      maxTokens: 1100

definition:
  triggers:
    - id: manual
      kind: manual
  result:
    summary: '{{ explain.output.text | default("LLM unavailable — see structured data for the policy list.") }}'
    data:
      total: "{{ load_policies.output | size }}"
      byState: "{{ by_state.output }}"
      byGrantOperator: "{{ by_grant_operator.output }}"
      byClientApps: "{{ by_client_apps.output }}"
      bySignInRisk: "{{ by_signin_risk.output }}"
      byUserRisk: "{{ by_user_risk.output }}"
      byModifiedAge: "{{ by_modified_age.output }}"
      policies: "{{ compact_policies.output }}"
      llmModel: "{{ explain.output.model }}"
