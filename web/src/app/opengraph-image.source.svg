<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <!--
    Open Graph image source (1200x630, the Facebook/LinkedIn/etc.
    canonical OG size). Mirrors the GitHub social-preview layout but
    at OG aspect.

    Rasterize:
      rsvg-convert -w 1200 -h 630 opengraph-image.source.svg -o opengraph-image.png
      (and copy to twitter-image.png)
  -->
  <rect width="1200" height="630" fill="#f4f5f7"/>

<g transform="translate(120 175) scale(2.8)"><rect width="100" height="100" rx="22" fill="#17191d"/><path fill="#f4f5f7" fill-rule="evenodd" d="M30 16H70Q84 16 84 30V70Q84 84 70 84L50 50L30 84Q16 84 16 70V30Q16 16 30 16Z M32 28H68Q72 28 72 32V69L50 31L28 69V32Q28 28 32 28Z M46 64H54L59 73H41Z"/></g>
  <!-- Wordmark + tagline on the right -->
  <text x="470" y="300" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="68" font-weight="600" letter-spacing="-2" fill="#17191d">
    OpenAdminOS
  </text>
  <text x="470" y="355" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="26" font-weight="400" fill="#424b58">
    Open-source, local-first agents
  </text>
  <text x="470" y="390" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="26" font-weight="400" fill="#424b58">
    for Microsoft 365 admins.
  </text>

  <!-- URL footer -->
  <text x="470" y="460" font-family="Menlo, Consolas, monospace"
        font-size="18" font-weight="400" fill="#535e6c">
    openadminos.com
  </text>
</svg>
